name: Sauvegarde depuis l'éditeur

on:
  repository_dispatch:
    types: [save_fiche]

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du repo etudes
        uses: actions/checkout@v4
        with:
          repository: gourbi-solido/etudes
          # On utilise votre secret GITHUBCODE2
          token: ${{ secrets.GITHUBCODE2 }}
          ref: main # Ou master, selon le nom de la branche principale de 'etudes'

      - name: Configurer l'authentification Git
        run: |
          # On dit à Git d'utiliser le token pour toutes les requêtes vers github.com
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GITHUBCODE2 }}" | base64)"

      - name: Sauvegarder le fichier
        run: |
          echo "${{ github.event.client_payload.content }}" | base64 -d > "${{ github.event.client_payload.filename }}"
          
      - name: Commit et Push
        run: |
          git config --global user.name "Editeur Solido Bot"
          git config --global user.email "bot@solido.local"
          git add "${{ github.event.client_payload.filename }}"
          # On vérifie s'il y a des changements avant de commit
          git diff --quiet && git diff --staged --quiet || git commit -m "Ajout de la fiche : ${{ github.event.client_payload.filename }}"
          git push origin HEAD:main
