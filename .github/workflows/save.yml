name: Sauvegarde depuis l'éditeur

on:
  repository_dispatch:
    types: [save_fiche]

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du repo etudes
        uses: actions/checkout@v4
        with:
          repository: gourbi-solido/etudes
          token: ${{ secrets.GITHUBCODE2 }}
          ref: main

      - name: Sauvegarder le fichier
        run: |
          echo "${{ github.event.client_payload.content }}" | base64 -d > "${{ github.event.client_payload.filename }}"
          
      - name: Commit et Push
        run: |
          git config --global user.name "Editeur Solido Bot"
          git config --global user.email "bot@solido.local"
          
          # Injection explicite du token dans l'URL distante pour authentifier le push
          git remote set-url origin https://x-access-token:${{ secrets.GITHUBCODE2 }}@github.com/gourbi-solido/etudes.git
          
          git add "${{ github.event.client_payload.filename }}"
          git commit -m "Ajout de la fiche : ${{ github.event.client_payload.filename }}" || echo "Pas de changement"
          git push
