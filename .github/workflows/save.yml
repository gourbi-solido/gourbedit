name: Sauvegarde depuis l'éditeur

on:
  repository_dispatch:
    types: [save_fiche]

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout du repo etudes
        uses: actions/checkout@v4
        with:
          repository: gourbi-solido/etudes
          token: ${{ secrets.GITHUBCODE2 }}
          ref: main

      - name: Sauvegarder le fichier
        run: |
          echo "${{ github.event.client_payload.content }}" | base64 -d > "${{ github.event.client_payload.filename }}"
          
      - name: Commit et Push automatique
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: .
          commit_user_name: "Editeur Solido Bot"
          commit_user_email: "bot@solido.local"
          commit_message: "Ajout de la fiche : ${{ github.event.client_payload.filename }}"
          file_pattern: "${{ github.event.client_payload.filename }}"
